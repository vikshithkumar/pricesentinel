version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pricesentinel-postgres
    environment:
      POSTGRES_DB: pricesentinel
      POSTGRES_USER: pricesentinel
      POSTGRES_PASSWORD: pricesentinel_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricesentinel -d pricesentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricesentinel-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/pricesentinel
      SPRING_DATASOURCE_USERNAME: pricesentinel
      SPRING_DATASOURCE_PASSWORD: pricesentinel_dev_password
      BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
