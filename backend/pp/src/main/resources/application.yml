spring:
  application:
    name: price-sentinel

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:pricesentinel;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

scraper:
  brightdata:
    api-key: ${BRIGHTDATA_API_KEY:}
    base-url: ${BRIGHTDATA_BASE_URL:https://api.brightdata.com}
    connect-timeout-ms: 10000
    read-timeout-ms: 30000
  poll:
    interval-ms: ${SCRAPER_POLL_INTERVAL_MS:5000}
    max-attempts: ${SCRAPER_POLL_MAX_ATTEMPTS:20}
  retry:
    max-attempts: ${SCRAPER_RETRY_MAX_ATTEMPTS:2}

llm:
  provider: ${LLM_PROVIDER:anthropic}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
    max-tokens: 512
    timeout-ms: 8000
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com
    model: ${OPENAI_MODEL:gpt-4o-mini}
    max-tokens: 512
    timeout-ms: 8000

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: ${PORT:8080}

logging:
  level:
    com.pricesentinel: INFO
    org.springframework.web: WARN
